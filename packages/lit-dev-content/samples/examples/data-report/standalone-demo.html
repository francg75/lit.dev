<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Report — Demo Standalone</title>
  <script type="importmap">
  {
    "imports": {
      "lit": "https://esm.run/lit",
      "lit/": "https://esm.run/lit/",
      "lit-html": "https://esm.run/lit-html",
      "lit-html/": "https://esm.run/lit-html/",
      "lit-element": "https://esm.run/lit-element",
      "lit-element/": "https://esm.run/lit-element/",
      "@lit/reactive-element": "https://esm.run/@lit/reactive-element",
      "@lit/reactive-element/": "https://esm.run/@lit/reactive-element/"
    }
  }
  </script>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      background: #f3f4f6;
      margin: 0;
    }
    h2 { color: #1e40af; margin: 24px 0 12px; }
    .note {
      background: #dbeafe;
      border-left: 4px solid #1e40af;
      padding: 12px 16px;
      margin-bottom: 20px;
      font-size: 14px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="note">
    <strong>Demo:</strong> Componente &lt;data-report&gt; estilo Crystal Report.
    Prueba los botones de exportar CSV, JSON y Print/PDF. Haz clic en las cabeceras para ordenar. Usa el buscador para filtrar.
  </div>

  <h2>Informe de Ventas (Agrupado por Region)</h2>
  <data-report id="salesReport"></data-report>

  <h2>Directorio de Empleados</h2>
  <data-report id="employeeReport"></data-report>

  <script type="module">
    import {LitElement, html, css, nothing} from 'lit';

    class DataReport extends LitElement {
      static properties = {
        reportTitle: {type: String},
        subtitle: {type: String},
        columns: {type: Array},
        data: {type: Array},
        groupBy: {type: Object},
        pageSize: {type: Number},
        showToolbar: {type: Boolean},
        _currentPage: {state: true},
        _sortKey: {state: true},
        _sortAsc: {state: true},
        _searchTerm: {state: true},
      };

      static styles = css`
        :host {
          display: block;
          font-family: var(--report-font, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif);
          font-size: var(--report-font-size, 12px);
          color: #333;
        }
        .report-container { border: 1px solid #ccc; background: #fff; overflow-x: auto; }
        .report-header { padding: 16px 20px; border-bottom: 2px solid #1a56db; background: linear-gradient(135deg, #f8fafc, #eef2ff); }
        .report-title { font-size: 1.5em; font-weight: 700; color: #1a56db; margin: 0 0 4px 0; }
        .report-subtitle { font-size: 0.9em; color: #666; margin: 0; }
        .report-meta { display: flex; gap: 16px; margin-top: 8px; font-size: 0.8em; color: #888; }
        .toolbar { display: flex; gap: 6px; padding: 8px 12px; background: #f9fafb; border-bottom: 1px solid #e5e7eb; flex-wrap: wrap; }
        .toolbar button { display: inline-flex; align-items: center; gap: 4px; padding: 5px 12px; font-size: 0.85em; border: 1px solid #d1d5db; border-radius: 4px; background: #fff; color: #374151; cursor: pointer; transition: all 0.15s; }
        .toolbar button:hover { background: #f3f4f6; border-color: #9ca3af; }
        .toolbar .search-box { margin-left: auto; display: flex; align-items: center; gap: 4px; }
        .toolbar input[type='text'] { padding: 4px 8px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 0.85em; width: 180px; }
        table { width: 100%; border-collapse: collapse; }
        thead th { position: sticky; top: 0; background: #1e40af; color: #fff; padding: 8px 10px; text-align: left; font-weight: 600; font-size: 0.9em; white-space: nowrap; cursor: pointer; user-select: none; border-right: 1px solid rgba(255,255,255,0.15); }
        thead th:hover { background: #1e3a8a; }
        thead th .sort-indicator { margin-left: 4px; opacity: 0.6; }
        thead th .sort-indicator.active { opacity: 1; }
        tbody tr { border-bottom: 1px solid #e5e7eb; }
        tbody tr:nth-child(even) { background: #f9fafb; }
        tbody tr:hover { background: #eef2ff; }
        tbody td { padding: 6px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 250px; }
        td.align-right, th.align-right { text-align: right; }
        td.align-center, th.align-center { text-align: center; }
        .group-header td { background: #e0e7ff; font-weight: 700; color: #1e40af; padding: 6px 10px; border-bottom: 2px solid #1e40af; }
        .summary-row td { background: #fef3c7; font-weight: 700; border-top: 2px solid #d97706; border-bottom: 2px solid #d97706; padding: 8px 10px; }
        .report-footer { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #f9fafb; border-top: 1px solid #e5e7eb; font-size: 0.8em; color: #6b7280; }
        .pagination { display: flex; align-items: center; gap: 4px; }
        .pagination button { padding: 3px 8px; border: 1px solid #d1d5db; border-radius: 3px; background: #fff; cursor: pointer; font-size: 0.9em; }
        .pagination button:disabled { opacity: 0.4; cursor: default; }
        .pagination button:not(:disabled):hover { background: #e5e7eb; }
        .pagination .page-info { margin: 0 8px; }
        @media print {
          .toolbar, .pagination { display: none !important; }
          .report-container { border: none; }
          thead th { background: #333 !important; color: #fff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
          tbody tr:nth-child(even) { background: #f3f3f3 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
          .summary-row td { background: #fff3cd !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
      `;

      constructor() {
        super();
        this.reportTitle = 'Data Report';
        this.subtitle = '';
        this.columns = [];
        this.data = [];
        this.groupBy = null;
        this.pageSize = 25;
        this.showToolbar = true;
        this._currentPage = 1;
        this._sortKey = '';
        this._sortAsc = true;
        this._searchTerm = '';
      }

      get _filteredData() {
        let result = [...this.data];
        if (this._searchTerm) {
          const term = this._searchTerm.toLowerCase();
          result = result.filter(row =>
            this.columns.some(col => String(row[col.key] ?? '').toLowerCase().includes(term))
          );
        }
        if (this._sortKey) {
          result.sort((a, b) => {
            const va = a[this._sortKey], vb = b[this._sortKey];
            let cmp = 0;
            if (typeof va === 'number' && typeof vb === 'number') cmp = va - vb;
            else cmp = String(va ?? '').localeCompare(String(vb ?? ''));
            return this._sortAsc ? cmp : -cmp;
          });
        }
        return result;
      }

      get _pagedData() {
        const start = (this._currentPage - 1) * this.pageSize;
        return this._filteredData.slice(start, start + this.pageSize);
      }

      get _totalPages() {
        return Math.max(1, Math.ceil(this._filteredData.length / this.pageSize));
      }

      _formatValue(value, format) {
        if (value == null) return '';
        switch (format) {
          case 'currency': return new Intl.NumberFormat('en-US', {style:'currency', currency:'USD'}).format(Number(value));
          case 'number': return new Intl.NumberFormat('en-US').format(Number(value));
          case 'percent': return new Intl.NumberFormat('en-US', {style:'percent', minimumFractionDigits:1}).format(Number(value));
          case 'date': return new Date(String(value)).toLocaleDateString('en-US');
          default: return String(value);
        }
      }

      _computeSummary(col, rows) {
        if (!col.summary) return '';
        const values = rows.map(r => Number(r[col.key])).filter(v => !isNaN(v));
        if (!values.length) return '';
        let result;
        switch (col.summary) {
          case 'sum': result = values.reduce((a,b) => a+b, 0); break;
          case 'avg': result = values.reduce((a,b) => a+b, 0) / values.length; break;
          case 'count': result = values.length; break;
          case 'min': result = Math.min(...values); break;
          case 'max': result = Math.max(...values); break;
          default: return '';
        }
        return this._formatValue(result, col.format);
      }

      _handleSort(key) {
        if (this._sortKey === key) this._sortAsc = !this._sortAsc;
        else { this._sortKey = key; this._sortAsc = true; }
        this._currentPage = 1;
      }

      _handleSearch(e) {
        this._searchTerm = e.target.value;
        this._currentPage = 1;
      }

      exportCSV() {
        const sep = ',';
        const header = this.columns.map(c => `"${c.label}"`).join(sep);
        const rows = this._filteredData.map(row =>
          this.columns.map(col => {
            const val = this._formatValue(row[col.key], col.format);
            return `"${val.replace(/"/g, '""')}"`;
          }).join(sep)
        );
        if (this.columns.some(c => c.summary)) {
          rows.push(this.columns.map(col => {
            if (col.summary) return `"${col.summary.toUpperCase()}: ${this._computeSummary(col, this._filteredData)}"`;
            return '""';
          }).join(sep));
        }
        this._downloadFile([header, ...rows].join('\n'), `${this.reportTitle}.csv`, 'text/csv');
      }

      exportJSON() {
        this._downloadFile(JSON.stringify(this._filteredData, null, 2), `${this.reportTitle}.json`, 'application/json');
      }

      printReport() {
        window.print();
      }

      _downloadFile(content, filename, mimeType) {
        const blob = new Blob([content], {type: mimeType});
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url; link.download = filename; link.click();
        URL.revokeObjectURL(url);
      }

      _renderRow(row) {
        return html`<tr>${this.columns.map(col => html`
          <td class="${col.align === 'right' ? 'align-right' : col.align === 'center' ? 'align-center' : ''}"
              style="${col.width ? `width:${col.width}` : ''}">
            ${this._formatValue(row[col.key], col.format)}
          </td>`)}</tr>`;
      }

      _renderBody() {
        if (!this.groupBy) return this._pagedData.map(row => this._renderRow(row));

        const grouped = new Map();
        for (const row of this._pagedData) {
          const key = String(row[this.groupBy.key] ?? '');
          if (!grouped.has(key)) grouped.set(key, []);
          grouped.get(key).push(row);
        }

        const rows = [];
        for (const [groupValue, groupRows] of grouped) {
          rows.push(html`<tr class="group-header"><td colspan="${this.columns.length}">${this.groupBy.label}: ${groupValue} (${groupRows.length})</td></tr>`);
          for (const row of groupRows) rows.push(this._renderRow(row));
          if (this.columns.some(c => c.summary)) {
            rows.push(html`<tr class="summary-row">${this.columns.map(col => html`
              <td class="${col.align === 'right' ? 'align-right' : ''}">${col.summary ? `${col.summary}: ${this._computeSummary(col, groupRows)}` : ''}</td>`)}</tr>`);
          }
        }
        return rows;
      }

      render() {
        const hasSummary = this.columns.some(c => c.summary);
        return html`
          <div class="report-container">
            <div class="report-header">
              <h1 class="report-title">${this.reportTitle}</h1>
              ${this.subtitle ? html`<p class="report-subtitle">${this.subtitle}</p>` : nothing}
              <div class="report-meta">
                <span>Generado: ${new Date().toLocaleString()}</span>
                <span>Registros: ${this._filteredData.length}</span>
              </div>
            </div>
            ${this.showToolbar ? html`
              <div class="toolbar">
                <button @click=${this.exportCSV}>&#128196; Exportar CSV</button>
                <button @click=${this.exportJSON}>&#128203; Exportar JSON</button>
                <button @click=${this.printReport}>&#128424; Imprimir / PDF</button>
                <div class="search-box">
                  <input type="text" placeholder="Buscar..." .value=${this._searchTerm} @input=${this._handleSearch}>
                </div>
              </div>` : nothing}
            <table>
              <thead><tr>${this.columns.map(col => html`
                <th class="${col.align === 'right' ? 'align-right' : col.align === 'center' ? 'align-center' : ''}"
                    @click=${() => this._handleSort(col.key)}>
                  ${col.label}
                  <span class="sort-indicator ${this._sortKey === col.key ? 'active' : ''}">
                    ${this._sortKey === col.key ? (this._sortAsc ? '\u25B2' : '\u25BC') : '\u21C5'}
                  </span>
                </th>`)}</tr></thead>
              <tbody>
                ${this._renderBody()}
                ${hasSummary && !this.groupBy ? html`
                  <tr class="summary-row">${this.columns.map(col => html`
                    <td class="${col.align === 'right' ? 'align-right' : ''}">
                      ${col.summary ? `${col.summary.toUpperCase()}: ${this._computeSummary(col, this._filteredData)}` : ''}
                    </td>`)}</tr>` : nothing}
              </tbody>
            </table>
            <div class="report-footer">
              <span>${this.reportTitle} — Pagina ${this._currentPage} de ${this._totalPages}</span>
              <div class="pagination">
                <button ?disabled=${this._currentPage <= 1} @click=${() => this._currentPage = 1}>&laquo;</button>
                <button ?disabled=${this._currentPage <= 1} @click=${() => this._currentPage--}>&lsaquo;</button>
                <span class="page-info">${this._currentPage} / ${this._totalPages}</span>
                <button ?disabled=${this._currentPage >= this._totalPages} @click=${() => this._currentPage++}>&rsaquo;</button>
                <button ?disabled=${this._currentPage >= this._totalPages} @click=${() => this._currentPage = this._totalPages}>&raquo;</button>
              </div>
            </div>
          </div>`;
      }
    }
    customElements.define('data-report', DataReport);
